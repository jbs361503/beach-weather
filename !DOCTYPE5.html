<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전국 해수욕장 날씨</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', sans-serif;
}

body{
    background:linear-gradient(to bottom,#87CEEB,#E6F7FF);
    min-height:100vh;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#0077cc;
    font-size:42px;
    margin-bottom:40px;
}

.top{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:35px;
}

select{
    padding:15px;
    border:none;
    border-radius:15px;
    background:#f2f8ff;
    font-size:18px;
    min-width:250px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:15px;
    background:#0077cc;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#005fa3;
}

.result{
    background:#f7fbff;
    padding:30px;
    border-radius:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.label{
    color:#666;
    margin-bottom:10px;
}

.value{
    font-size:30px;
    font-weight:bold;
    color:#0077cc;
}

.loading{
    text-align:center;
    font-size:22px;
    color:#0077cc;
}

.error{
    color:red;
    text-align:center;
    font-size:20px;
}

</style>
</head>

<body>

<div class="container">

<h1>🌊 전국 해수욕장 날씨 조회</h1>

<div class="top">

<select id="beach">

<option value="GYEONGPO">경포해수욕장</option>
<option value="NAKSAN">낙산해수욕장</option>
<option value="DAECHON">대천해수욕장</option>
<option value="MANGSANG">망상해수욕장</option>
<option value="SONGJEONG">송정해수욕장</option>
<option value="HAEUNDAE">해운대해수욕장</option>

</select>

<button onclick="loadWeather()">
조회하기
</button>

</div>

<div class="result">

<div id="result">

<div class="loading">
조회 버튼을 눌러주세요.
</div>

</div>

</div>

</div>

<script>

const SERVICE_KEY =
"318dd9c03d381f55840686e8f072e6e43de91af0eac5ae2298263fb21e032798";

async function loadWeather(){

    document.getElementById("result").innerHTML =
    `<div class="loading">불러오는 중...</div>`;

    const beach =
        document.getElementById("beach").value;

    const today = new Date();

    const yyyy = today.getFullYear();

    const mm =
        String(today.getMonth()+1).padStart(2,'0');

    const dd =
        String(today.getDate()).padStart(2,'0');

    const baseDate = `${yyyy}${mm}${dd}`;

    const apiUrl =
`https://apis.data.go.kr/1360000/BeachInfoservice/getVilageFcstBeach?serviceKey=${SERVICE_KEY}&pageNo=1&numOfRows=100&dataType=JSON&base_date=${baseDate}&base_time=0500&beach_num=${beach}`;

    // CORS 우회
    const proxyUrl =
`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`;

    try{

        const response = await fetch(proxyUrl);

        const data = await response.json();

        console.log(data);

        if(
            !data.response ||
            data.response.header.resultCode !== "00"
        ){

            document.getElementById("result").innerHTML =
            `
            <div class="error">
                API 오류 발생<br><br>
                ${data.response.header.resultMsg}
            </div>
            `;

            return;
        }

        const items =
            data.response.body.items.item;

        let temp = "-";
        let sky = "-";
        let wind = "-";
        let rain = "-";

        items.forEach(item=>{

            if(item.category === "TMP"){
                temp = item.fcstValue + "°C";
            }

            if(item.category === "WSD"){
                wind = item.fcstValue + "m/s";
            }

            if(item.category === "POP"){
                rain = item.fcstValue + "%";
            }

            if(item.category === "SKY"){

                if(item.fcstValue == "1"){
                    sky = "☀️ 맑음";
                }

                else if(item.fcstValue == "3"){
                    sky = "⛅ 구름많음";
                }

                else if(item.fcstValue == "4"){
                    sky = "☁️ 흐림";
                }

            }

        });

        document.getElementById("result").innerHTML =

        `
        <div class="grid">

            <div class="card">
                <div class="label">현재 기온</div>
                <div class="value">${temp}</div>
            </div>

            <div class="card">
                <div class="label">하늘 상태</div>
                <div class="value">${sky}</div>
            </div>

            <div class="card">
                <div class="label">풍속</div>
                <div class="value">${wind}</div>
            </div>

            <div class="card">
                <div class="label">강수확률</div>
                <div class="value">${rain}</div>
            </div>

        </div>
        `;

    }catch(error){

        console.error(error);

        document.getElementById("result").innerHTML =
        `
        <div class="error">
            데이터를 불러오지 못했습니다.
        </div>
        `;

    }

}

</script>

</body>
</html>
